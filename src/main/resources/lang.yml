  offer-received: "{prefix}<yellow>Otrzymałeś ofertę zakupu działki <gold>{name}</gold> od gracza <aqua>{seller}</aqua> za kwotę <gold>{price}</gold>! Wpisz <click:run_command:'/plots accept {offer_id}'><green><u>/plots accept {offer_id}</u></green></click> aby przyjąć.</yellow>"
  offer-invalid: "{prefix}<red>Ta oferta nie istnieje lub wygasła.</red>"
