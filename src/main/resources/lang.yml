  success: "{prefix}<green>Pomyślnie wynająłeś nieruchomość <gold>{name}</gold> (<white>{plot_id}</white>) na okres <aqua>{duration}</aqua>!</green>"
  terminated: "{prefix}<red>Twój wynajem nieruchomości <yellow>{plot_id}</yellow> został zakończony (<white>{reason}</white>).</red>"
  auto-renewed: "{prefix}<green>Przedłużono automatycznie wynajem działki <gold>{name}</gold> na kolejny okres.</green>"
  not-available: "{prefix}<red>Ta nieruchomość nie jest obecnie dostępna pod wynajem.</red>"
  already-rented: "{prefix}<red>Ta nieruchomość jest już obecnie wynajmowana.</red>"
  offer-success: "{prefix}<green>Udostępniono działkę <yellow>{plot_id}</yellow> do wynajmu (stawka: <gold>{price}</gold>, kaucja: <yellow>{deposit}</yellow>).</green>"
  cancel-success: "{prefix}<gold>Zakończono i wyłączono wynajem działki <yellow>{plot_id}</yellow>.</gold>"

transfer:
