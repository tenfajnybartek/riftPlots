  buyer-success: "{prefix}<green><b>Gratulacje!</b> Przejąłeś prawo własności do działki <gold>{name}</gold>!</green>"
  seller-success: "{prefix}<green>Twoja działka <gold>{name}</gold> została sprzedana graczowi <yellow>{buyer}</yellow> za <gold>{price}</gold>!</green>"
  cancelled: "{prefix}<gold>Oferta sprzedaży działki została anulowana.</gold>"
  no-offers: "{prefix}<gray>Brak aktywnych ofert zakupu.</gray>"

auction:
  not-active: "{prefix}<red>Ta licytacja nie jest aktywna lub już się zakończyła.</red>"
  cannot-afford: "{prefix}<red>Nie posiadasz wystarczających środków, aby złożyć tę ofertę (<yellow>{amount}</yellow>).</red>"
  min-bid-error: "{prefix}<red>Minimalna kwota przebicia wynosi: <yellow>{min}</yellow>.</red>"
  bid-accepted: "{prefix}<green>Twoja oferta <gold>{amount}</gold> na działkę <yellow>{plot_id}</yellow> została przyjęta!</green>"
  won: "{prefix}<green><b>Wygrałeś licytację działki <gold>{name}</gold>!</b> Kwota: <yellow>{amount}</yellow>.</green>"
