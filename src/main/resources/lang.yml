  cannot-afford: "{prefix}<red>Teleportacja kosztuje <yellow>{cost}</yellow>. Brak wystarczających środków.</red>"
  unsafe: "{prefix}<red>Nie znaleziono bezpiecznego miejsca na działce do teleportacji!</red>"
  success: "{prefix}<green>Przeteleportowano do punktu domowego działki <gold>{name}</gold>!</green>"
  set-success: "{prefix}<green>Pomyślnie zaktualizowano punkt domowy dla działki <gold>{name}</gold>!</green>"
  outside-bounds: "{prefix}<red>Musisz stać wewnątrz granic działki, aby zapisać punkt domowy!</red>"

budget:
