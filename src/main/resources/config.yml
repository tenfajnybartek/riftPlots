# ==============================================================================
#                      riftPlots - Konfiguracja Główna
# ==============================================================================
# Zaawansowany system miejskich działek na serwer Minecraft (Paper 26.3)
# Kompatybilny z Vault, WorldEdit oraz WorldGuard.

general:
  # Prefiks wyświetlany przed wiadomościami na czacie (format Adventure / MiniMessage)
  prefix: "<gradient:#00c6ff:#0072ff><b>riftPlots</b></gradient> <gray>»</gray> "

  # Symbol waluty używany przy wyświetlaniu cen i podatków
  currency-symbol: "$"

  # Czy symbol waluty ma być wyświetlany po kwocie (true: '100 $', false: '$100')
  currency-symbol-suffix: true

economy:
  default-tax-enabled: true
  decimal-places: 2
  rounding-mode: HALF_UP
  maximum-transaction-amount: '999999999999.99'
  # Domyślna cena zakupu nowo tworzonej działki (w jednostkach waluty serwera)
  default-price: 25000.0

  # Domyślny bazowy podatek cykliczny pobierany od właściciela
  default-base-tax: 1500.0

  # Domyślny tryb naliczania podatku:
  # - FIXED: Stała kwota bazowa za każdy okres rozliczeniowy
  # - PER_BLOCK: Stawka mnożona przez powierzchnię poziomą działki (X * Z)
  # - PER_CHUNK: Stawka mnożona przez liczbę chunków obejmowanych przez działkę
  # - SIZE_TIERS: Dynamiczna stawka na podstawie progów wielkości
  # - MULTIPLIER: Kwota bazowa mnożona przez indywidualny współczynnik działki
  # - CUSTOM: Indywidualna stawka ustalona bezpośrednio dla danej nieruchomości
  default-tax-mode: "FIXED"

  # Domyślny mnożnik podatku dla nowej działki
  default-tax-multiplier: 1.0

  # Domyślna długość okresu rozliczeniowego w dniach (np. 7 = co tydzień)
  default-billing-period-days: 7

  # Czas karencji w godzinach po upłynięciu terminu płatności (domyślnie 6 godzin)
  # W tym czasie działka przechodzi w stan GRACE_PERIOD, po czym zostaje odebrana i zresetowana.
  default-grace-period-hours: 6

  # Maksymalna liczba okresów rozliczeniowych, które gracz może opłacić z góry
  max-advance-periods: 4

  # Procent ceny zakupu zwracany graczowi przy dobrowolnym oddaniu działki (/plots abandon)
  # Zakres od 0.0 (brak zwrotu) do 100.0 (pełny zwrot)
  default-abandon-refund-percent: 50.0

scheduler:
  grace-warning-interval-seconds: 300
  # Częstotliwość sprawdzania terminów płatności i okresów karencji (w sekundach)
  check-interval-seconds: 60

  # Godziny przed terminem płatności, w których wysyłane są powiadomienia przypominające
  tax-reminder-hours:
    - 48
    - 24
    - 12
    - 2
    - 1

protection:
  # Czy blokować przemieszczanie bloków przez tłoki z/do działki przez granicę
  prevent-piston-border-crossing: true

  # Czy blokować rozlewanie się wody i lawy przez granice działki
  prevent-fluid-border-crossing: true

  # Czy blokować niszczenie bloków przez eksplozje wewnątrz i na granicy działki
  prevent-explosions: true

  # Czy blokować rozprzestrzenianie się ognia na działkach
  prevent-fire-spread: true

  # Czy chronić stojaki na zbroje (Armor Stands) przed nieuprawnioną modyfikacją
  protect-armor-stands: true

  # Czy chronić ramki na przedmioty (Item Frames) przed obracaniem i niszczeniem
  protect-item-frames: true

reset:
  # Czy po bezskutecznym upływie okresu karencji działka ma być automatycznie resetowana
  auto-reset-on-expire: true

  # Liczba bloków wklejanych w jednej porcji (zapobiega lagom głównego wątku przy dużych obiektach)
  block-batch-size: 2500

  # Opóźnienie między kolejnymi porcjami wklejania (w tickach serwera, 1 tick = 50ms)
  tick-delay: 1

signs:
  # Układ czterech wierszy. Komponenty *_header / *_action pochodzą z signs.formats.
  layouts:
    sale: ['{header}', '<white>{plot_id}</white>', '<green>{price}</green>', '{for_sale_action}']
    market: ['{header}', '<white>{plot_id}</white>', '<gold>{market}</gold>', '{resetting_action}']
    resetting: ['{header}', '<white>{plot_id}</white>', '<gray>{status}</gray>', '{resetting_action}']
    disabled: ['{header}', '<white>{plot_id}</white>', '<dark_red>{status}</dark_red>', '{disabled_action}']
    owned: ['{header}', '<white>{plot_id}</white>', '<aqua>{owner}</aqua>', '{sold_action}']
    renew: ['{renew_header}', '<white>{plot_id}</white>', '<green>{tax}</green>', '{renew_action}']
    status: ['<gold>{plot_name}</gold>', '<white>{plot_id}</white>', '<aqua>{owner}</aqua>', '{status}']
  # Czy obsługa interaktywnych tabliczek działek ma być aktywna
  enabled: true

  # Czy tabliczki mają być automatycznie aktualizowane przy zmianie stanu działki
  auto-update: true

  # Formaty linii na tabliczkach (obsługa MiniMessage)
  formats:
    header: "<gradient:#00c6ff:#0072ff><b>[DZIAŁKA]</b></gradient>"
    renew-header: "<gradient:#ff9900:#ff5500><b>[OPŁAĆ PODATEK]</b></gradient>"
    for-sale-action: "<green><b>KUP TERAZ</b></green>"
    sold-action: "<red><b>SPRZEDANA</b></red>"
    renew-action: "<aqua><b>PRZEDŁUŻ</b></aqua>"
    resetting-action: "<red><b>NIEDOSTĘPNA</b></red>"
    disabled-action: "<dark_red><b>BLOKADA</b></dark_red>"

market:
  # Procent prowizji pobierany przez Skarb Miasta przy sprzedaży działki gracz-gracz (/plots transfer)
  transfer-fee-percent: 5.0

  # Czas ważności oferty sprzedaży w sekundach (domyślnie 5 minut)
  transfer-offer-duration-seconds: 300

auction:
  # Dotyczy nowych aukcji. Kwota oferty jest blokowana i zwracana po przebiciu.
  escrow-enabled: false
  # Prowizja miejska potrącana ze zwycięskiej oferty aukcji (w procentach)
  city-fee-percent: 5.0

  # Czas (w sekundach), o jaki przedłużana jest aukcja, jeśli ktoś zalicytuje pod sam koniec (Anti-Snipe)
  anti-snipe-extension-seconds: 120

  # Domyślny minimalny krok przebicia oferty w walucie serwera
  default-min-bid-increment: 100.0

  # Domyślny czas trwania licytacji w minutach
  default-duration-minutes: 30

teleport:
  # Czy komenda powrotu do domu działki (/plots home) jest aktywna
  enabled: true

  # Koszt teleportacji na działkę (0.0 = darmowa)
  cost: 50.0

  # Czas odnowienia (cooldown) komendy teleportacji w sekundach
  cooldown-seconds: 10

city-budget:
  # Początkowe saldo wirtualnego Skarbu Miasta przy pierwszym uruchomieniu
  initial-balance: 100000.0

privacy:
  # false: historię działki widzi właściciel i administracja.
  public-history: false

rental:
  default-tenant-permissions: [BUILD, DESTROY, CONTAINERS, DOORS, INTERACT, TELEPORT]
  default-unit: DAY
  max-periods: 365
  default-periods: 1
  default-auto-renew: false

visualization:
  border-particle: DUST
  border-duration-seconds: 10
  border-cooldown-seconds: 10
  border-points: 120
  border-color: '#00c6ff'
  border-particle-size: 1.1
  border-interval-ticks: 10

notifications:
  retention-days: 30
  max-history-per-player: 200
  sound-volume: 1.0
  sound-pitch: 1.0
  title-fade-in-ms: 300
  title-stay-ms: 3000
  title-fade-out-ms: 500

# Rozmiary stron czatu/historii (GUI ma własne content-slots w gui.yml).
paging:
  repository-history: 100
  history: 10
  audit: 20
  auction-history: 10
  notifications: 10
  budget: 15
  pending-transactions: 30
  pending-refunds: 30
  refunds-in-player-history: 10

billing:
  default-payment-periods: 1

formatting:
  money-locale: 'pl-PL'
  money-grouping: true
  date-pattern: 'yyyy-MM-dd HH:mm:ss'
  timezone: 'system'

tax:
  minimum-multiplier: 0.01
  size-tier-limits: [250, 1000, 2500, 5000]
  size-tier-multipliers: [1.0, 1.5, 2.5, 4.0]
  size-tier-overflow-multiplier: 6.0

rental-period-seconds:
  HOUR: 3600
  DAY: 86400
  WEEK: 604800
  MONTH: 2592000

refunds:
  retry-multiplier: 2.0
  retry-initial-seconds: 60
  retry-maximum-seconds: 3600

worldguard:
  region-priority: 10

interaction:
  sign-target-distance: 5

performance:
  scheduler-initial-delay-ticks: 100
  spatial-index-max-chunks-per-plot: 4096
  io-shutdown-timeout-seconds: 30

plots:
  default-category: RESIDENTIAL
  default-type: RESIDENTIAL
  default-icon: GRASS_BLOCK
  default-max-members: 5
  rental-allowed: true
  sales-allowed: true

sounds:
  offline-messages: 'minecraft:entity.experience_orb.pickup'
  auction-bid: 'minecraft:block.note_block.bell'
  auction-won: 'minecraft:ui.toast.challenge_complete'
  rental-start: 'minecraft:entity.player.levelup'
  rental-end: 'minecraft:block.note_block.bass'
  rental-renewal: 'minecraft:block.note_block.pling'
  transfer-offer-sent: 'minecraft:block.note_block.pling'
  transfer-offer-received: 'minecraft:entity.experience_orb.pickup'
  transfer-buyer-success: 'minecraft:ui.toast.challenge_complete'
  transfer-seller-success: 'minecraft:entity.player.levelup'

district-defaults:
  price-multiplier: 1.0
  tax-multiplier: 1.0
  max-plots-per-player: 3
  sales-enabled: true
  rental-enabled: true

members:
  default-permissions: [INTERACT, DOORS, CONTAINERS, TELEPORT]

# Wyłącznie podpowiedzi liczbowe; walidacja komend nadal sprawdza ich zakres.
tab-completion:
  budget-amounts: ['1000', '5000', '10000', '50000', '100000']
  grace-hours: ['1', '3', '6', '12', '24', '48']
  billing-days: ['1', '3', '7', '14', '30']
  plot-prices: ['10000', '25000', '50000', '100000']
  plot-taxes: ['500', '1000', '1500', '2500', '5000']
  payment-periods: ['1', '2', '3', '4']
  rental-periods: ['1', '2', '3', '7', '14', '30']
  transfer-prices: ['0', '1000', '5000', '10000', '50000']
