name: Build and storage tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: riftplots-ci
          MYSQL_ROOT_HOST: '%'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h127.0.0.1 -priftplots-ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      RIFTPLOTS_MYSQL_HOST: 127.0.0.1
      RIFTPLOTS_MYSQL_PORT: '3306'
      RIFTPLOTS_MYSQL_USER: root
      RIFTPLOTS_MYSQL_PASSWORD: riftplots-ci
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Verify wrapper files
        run: |
          test -s gradle/wrapper/gradle-wrapper.jar
          test -s gradle/wrapper/gradle-wrapper.properties
          test -s gradlew.bat
          chmod +x gradlew
      - name: Build, regressions and native SQLite in the shaded JAR
        run: ./gradlew test build --no-daemon --console=plain
      - name: Documentation and backup tools
        run: |
          python3 scripts/wiki.py check
          python3 -m unittest discover -s scripts/tests -v
